<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Palette Preview</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <header>
        <h1>Palette Preview</h1>
        <p>Try color combinations before you commit them to a design.</p>
      </header>
      <section class="controls">
        <button id="add-swatch" type="button">Add color</button>
        <button id="theme-toggle" type="button">Toggle theme</button>
      </section>
      <section id="swatches" class="swatches" aria-label="Color swatches"></section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
